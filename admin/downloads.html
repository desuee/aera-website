<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beta-Downloads – dev-dsue</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/admin/style.css?v=3">
<script src="/admin/downloads.js?v=1" defer></script>
<style>
.dl{max-width:980px;margin:0 auto;padding:28px 20px 60px;font-family:inherit}
.dl h1{font-size:22px;margin:0 0 4px}.dl .sub{opacity:.65;margin:0 0 22px;font-size:14px}
.dl .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:26px}
.dl .card{border:1px solid rgba(127,127,127,.25);border-radius:12px;padding:14px 16px}.dl .card b{display:block;font-size:28px;margin-top:4px}
.dl table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:26px}.dl th,.dl td{text-align:left;padding:8px 10px;border-bottom:1px solid rgba(127,127,127,.18)}
.dl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.6}.dl td.n{text-align:right;font-variant-numeric:tabular-nums}
.dl .bar{height:6px;border-radius:3px;background:var(--chrome-btn);min-width:2px}.dl h2{font-size:16px;margin:8px 0 10px}.dl .err{color:#e5484d}
.dl a.back{display:inline-block;margin-bottom:16px;font-size:14px}
</style>
</head>
<body>
<main class="dl">
  <a class="back" href="/admin/#dash">← Admin</a> · <a class="back" href="/admin/studio">Studio</a>
  <h1>AERA Beta – Downloads</h1>
  <p class="sub" id="sub">Lade …</p>
  <div class="cards" id="cards"></div>
  <h2>Pro Version</h2>
  <table id="rel"><thead><tr><th>Version</th><th>Datei</th><th>Datum</th><th class="n">Downloads</th><th></th></tr></thead><tbody></tbody></table>
  <h2>Tester seit dem letzten Server-Neustart</h2>
  <table id="usr"><thead><tr><th>Discord-Name</th><th class="n">Downloads</th></tr></thead><tbody></tbody></table>
  <h2>Letzte Downloads</h2>
  <table id="log"><thead><tr><th>Zeit</th><th>Tester</th><th>Datei</th></tr></thead><tbody></tbody></table>
</main>
</body>
</html>
